<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NWO: MASTER SYSTEM SETUP</title>
    <style>
        body { background-color: #05070a; color: #d1d9e6; font-family: 'Courier New', monospace; padding: 20px; }
        .hud-container { max-width: 1000px; margin: 0 auto; border: 1px solid #1a2333; background: #090d14; padding: 25px; }
        h1 { text-align: center; color: #739ac2; font-size: 22px; text-transform: uppercase; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .panel { border: 1px solid #141f2e; background: #0c1320; padding: 15px; }
        label { display: block; color: #8da4c4; font-size: 13px; margin-bottom: 5px; }
        select, input { width: 100%; background: #05070a; border: 1px solid #1a2333; color: #d1d9e6; padding: 8px; box-sizing: border-box; }
        .slider-box { display: flex; align-items: center; background: #05070a; padding: 8px; margin-top: 10px; border: 1px solid #141f2e; }
        .btn { width: 100%; background: #1c2e40; border: 1px solid #334d66; color: #a3c2e0; padding: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="hud-container">
    <h1>🛸 NWO: NEW WORLD ORDER — CONFIGURATION MATRIX</h1>
    <div class="grid-layout">
        <div class="panel">
            <label>Lobby Entry Mode</label>
            <select><option>CLOSED_GENESIS</option><option>INFILTRATION_ALLOW</option></select>
        </div>
        <div class="panel">
            <label>Total Live Seats (3 - 13)</label>
            <input type="number" min="3" max="13" value="7">
        </div>
    </div>
    <div class="panel" style="margin-top:20px;">
        <label>AI Personality Factory Sliders (-5 to +5)</label>
        <div class="slider-box"><span>⚔️ Aggro</span><input type="range" min="-5" max="5" value="0"></div>
        <div class="slider-box"><span>🕵️ Spy</span><input type="range" min="-5" max="5" value="0"></div>
        <div class="slider-box"><span>🤝 Trust</span><input type="range" min="-5" max="5" value="0"></div>
    </div>
    <button class="btn" onclick="alert('⚡ INITIALIZING ENGINE SEATS...')">Initialize Matrix</button>
</div>
</body>
</html>
